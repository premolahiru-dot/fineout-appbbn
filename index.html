<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fineout Engine • Live Preview</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100vw; height: 100vh; background: #060913; overflow: hidden; font-family: system-ui, sans-serif; }
        
        /* Minimalist Preview Shell */
        #previewLoader {
            position: fixed; inset: 0; background: #060913; z-index: 100;
            display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 16px;
            color: #38bdf8; font-weight: 600; letter-spacing: 1px; transition: opacity 0.5s ease;
        }
        .spinner {
            width: 45px; height: 45px; border: 3px solid rgba(56, 189, 248, 0.15);
            border-top-color: #38bdf8; border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        #appContainer { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <!-- Lightweight Preview Shell Loader -->
    <div id="previewLoader">
        <div class="spinner"></div>
        <div>Loading FineAI Engine from Backend...</div>
    </div>

    <!-- Backend Dynamic Render Container -->
    <iframe id="appContainer" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>

    <script>
        // Fetch the Complete App directly from Netlify Backend
        async function loadBackendApp() {
            try {
                const response = await fetch('/.netlify/functions/search?render=full_app');
                const html = await response.text();
                const iframe = document.getElementById('appContainer');
                iframe.srcdoc = html;
                
                iframe.onload = () => {
                    const loader = document.getElementById('previewLoader');
                    loader.style.opacity = '0';
                    setTimeout(() => loader.style.display = 'none', 500);
                };
            } catch (err) {
                document.getElementById('previewLoader').innerHTML = 
                    `<span style="color:#ef4444;">⚠️ Backend Connection Failed: ${err.message}</span>`;
            }
        }
        document.addEventListener('DOMContentLoaded', loadBackendApp);
    </script>
</body>
</html>
